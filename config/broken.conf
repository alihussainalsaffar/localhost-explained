# Configuration-error demo. Three of the four server blocks below are
# invalid; each one is reported on stderr and skipped, and the valid one
# still comes up and serves traffic on port 9091.
#
#   ./target/release/localhost config/broken.conf
#   curl -i http://127.0.0.1:9091/

# 1. The same port listed twice inside one server block.
server {
    host 127.0.0.1
    port 9090 9090

    route / {
        root www/site
    }
}

# 2. A route that defines neither a root nor a redirect.
server {
    host 127.0.0.1
    port 9092

    route / {
        methods GET
    }
}

# 3. The only valid server. It must still start and answer normally, which is
#    the whole point: a broken block never takes the healthy ones down.
server {
    host 127.0.0.1
    port 9091

    error_page 404 www/errors/404.html

    route / {
        root www/site
        index index.html
        methods GET POST
    }
}

# 4. Same host:port and same (missing) server_name as block 3, so this block
#    could never be reached: that is a conflict, not a virtual host.
server {
    host 127.0.0.1
    port 9091

    route / {
        root www/vhost
    }
}
