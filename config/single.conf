# Audit case: a single server on a single port.
#
#   ./target/release/localhost config/single.conf
#   curl -i http://127.0.0.1:8080/

server {
    host 127.0.0.1
    port 8080
    server_name localhost

    error_page 404 www/errors/404.html
    client_max_body_size 1048576

    route / {
        root www/site
        index index.html
        methods GET POST
    }
}
