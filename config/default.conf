# The default configuration: one main server on two ports plus a second
# virtual-host server sharing port 8080.

server {
    host 127.0.0.1
    port 8080 8081
    server_name localhost

    error_page 400 www/errors/400.html
    error_page 403 www/errors/403.html
    error_page 404 www/errors/404.html
    error_page 405 www/errors/405.html
    error_page 413 www/errors/413.html
    error_page 500 www/errors/500.html

    client_max_body_size 1048576

    route / {
        root www/site
        index index.html
        methods GET POST
    }

    route /files {
        root www/files
        methods GET
        directory_listing on
    }

    route /uploads {
        root www/uploads
        methods GET POST DELETE
        upload on
        directory_listing on
    }

    route /old {
        redirect /about.html
    }

    route /cgi {
        root www/cgi
        cgi .py python3
        methods GET POST
    }
}

# Same host:port as the server above, told apart by the Host header.
# Its body limit is deliberately tiny so the 413 path is easy to demo:
#   curl --resolve test.com:8080:127.0.0.1 -X POST --data "short" http://test.com:8080/
#   curl --resolve test.com:8080:127.0.0.1 -X POST --data "@big-file" http://test.com:8080/
server {
    host 127.0.0.1
    port 8080
    server_name test.com

    error_page 404 www/errors/404.html
    error_page 413 www/errors/413.html

    client_max_body_size 1024

    route / {
        root www/vhost
        index index.html
        methods GET POST
    }
}
