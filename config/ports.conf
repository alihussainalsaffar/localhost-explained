# Audit case: several independent servers, each on its own port, each with a
# different document root. Proves that one process serves several sites.
#
#   ./target/release/localhost config/ports.conf
#   curl http://127.0.0.1:8080/   -> the demo site
#   curl http://127.0.0.1:8081/   -> the vhost page
#   curl http://127.0.0.1:8082/   -> a directory listing of www/files

server {
    host 127.0.0.1
    port 8080
    server_name site

    error_page 404 www/errors/404.html

    route / {
        root www/site
        index index.html
        methods GET POST
    }
}

server {
    host 127.0.0.1
    port 8081
    server_name other

    error_page 404 www/errors/404.html

    route / {
        root www/vhost
        index index.html
        methods GET
    }
}

server {
    host 127.0.0.1
    port 8082
    server_name files

    error_page 403 www/errors/403.html

    route / {
        root www/files
        methods GET
        directory_listing on
    }
}
