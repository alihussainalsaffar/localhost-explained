# Audit case: several servers sharing one host:port, told apart by the Host
# header. The first block for an address is the default when no server_name
# matches.
#
#   ./target/release/localhost config/vhosts.conf
#   curl --resolve alpha.com:8080:127.0.0.1 http://alpha.com:8080/
#   curl --resolve beta.com:8080:127.0.0.1  http://beta.com:8080/
#   curl -H "Host: nobody.example" http://127.0.0.1:8080/   -> falls back to alpha

server {
    host 127.0.0.1
    port 8080
    server_name alpha.com

    error_page 404 www/errors/404.html

    route / {
        root www/site
        index index.html
        methods GET POST
    }
}

server {
    host 127.0.0.1
    port 8080
    server_name beta.com

    error_page 404 www/errors/404.html

    route / {
        root www/beta
        index index.html
        methods GET
    }
}
